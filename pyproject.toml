#
# Minimal PEP 517 shim. setup.py remains authoritative for all package
# metadata (name, version, package_data, custom build_py/bdist_wheel that
# stage the prebuilt *.so + HSA kernels, and the JA_WHEEL_VARIANT logic).
# Do NOT migrate metadata here.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
