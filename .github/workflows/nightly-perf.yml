name: JAX-AITER Nightly MXFP4 Regression

# One canonical FSDP4 process on the 4-GPU pool. This is a regression detector,
# not the FSDP8 publication operating point. Record-only until the first
# TheRock 7.14 / JAX 0.11 baseline is reviewed and committed.

on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: "Default alpha2 wheel URL"
        type: string
        default: "https://github.com/ROCm/jax-aiter/releases/download/v0.1.0-alpha2/jax_aiter-0.1.0a2-cp312-cp312-manylinux_2_28_x86_64.whl"
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: nightly-mxfp4-fsdp4
  # Do not cancel a process after spending the compilation/warm-up cost.
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rocm/jax-base-ubu24.therock-7.14:7.14
  CONTAINER_NAME: ja_perf_fsdp4
  WHEEL_URL: ${{ inputs.wheel_url || 'https://github.com/ROCm/jax-aiter/releases/download/v0.1.0-alpha2/jax_aiter-0.1.0a2-cp312-cp312-manylinux_2_28_x86_64.whl' }}

jobs:
  mxfp4-fsdp4:
    name: MXFP4 Llama 3.1 8B (4x MI355)
    runs-on: linux-jax-aiter-mi355-4
    timeout-minutes: 180
    steps:
      - name: Fix permissions from a previous container run
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}" || true
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download alpha2 default wheel
        run: |
          mkdir -p dist
          curl -fL --retry 3 --retry-delay 2 \
            -o dist/jax_aiter-0.1.0a2-cp312-cp312-manylinux_2_28_x86_64.whl \
            "$WHEEL_URL"

      - name: Pull runtime image
        run: docker pull "$IMAGE"

      - name: Launch isolated 4-GPU container
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d --name "$CONTAINER_NAME" \
            --network=host --device=/dev/kfd --device=/dev/dri \
            --ipc=host --shm-size=64G --group-add=video \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -e GPU_ARCHS=gfx950 -e AITER_SYMBOL_VISIBLE=1 \
            -e HIP_VISIBLE_DEVICES=0,1,2,3 \
            -v "${{ github.workspace }}:/jax-aiter" \
            -w /jax-aiter "$IMAGE" tail -f /dev/null

      - name: Install JAX, JAX-AITER, and MHA assets
        run: |
          docker exec "$CONTAINER_NAME" bash -lc '
            bash ci/setup_jax.sh --jax-only
            python3 -m pip install --break-system-packages \
              dist/jax_aiter-0.1.0a2-cp312-cp312-manylinux_2_28_x86_64.whl
            cd /tmp
            jax-aiter-fetch-mha
            python3 -c "import jax; from jax_aiter.mha import flash_attn_func; print(jax.devices(), flash_attn_func)"
          '

      - name: Run canonical MXFP4 FSDP4 process
        run: |
          docker exec \
            -e PERF_OUT_DIR=/jax-aiter/ci_perf_out \
            -e MAXTEXT_DIR=/maxtext_perf \
            "$CONTAINER_NAME" bash -lc 'bash ci/perf/run_8b_fp4.sh'

      - name: Parse tail-10 (record-only)
        if: always()
        run: |
          python3 ci/perf/parse_perf_log.py \
            --log ci_perf_out/mxfp4/train.log \
            --out-json ci_perf_out/perf_8b_fp4.json \
            --label 8b_fp4 --tail-n 10 \
            --step-summary ci_perf_out/perf_8b_fp4_summary.md

      - name: Write step summary
        if: always()
        run: |
          if [ -f ci_perf_out/perf_8b_fp4_summary.md ]; then
            cat ci_perf_out/perf_8b_fp4_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-8b-fp4-fsdp4
          path: |
            ci_perf_out/mxfp4/train.log
            ci_perf_out/perf_8b_fp4.json
            ci_perf_out/perf_8b_fp4_summary.md
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
