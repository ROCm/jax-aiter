name: JAX-AITER CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rocm/jax-base-ubu24.rocm720:latest
  JA_ROOT_DIR: /jax-aiter
  AITER_SYMBOL_VISIBLE: 1
  GPU_ARCHS: "gfx942;gfx950"
  AITER_ASM_DIR: /jax-aiter/third_party/aiter/hsa/

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux]

    env:
      CONTAINER_NAME: rv_aiter_ci

    steps:
      - name: Fix permissions from previous Docker run
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true
          fi

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get third_party/aiter submodule SHA
        id: aiter_sha
        run: echo "sha=$(git -C third_party/aiter rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Shared JIT-lib cache key. The SAME string is used by ci.yml,
      # nightly-ci.yml, cache-refresh.yml and nightly-perf.yml so the multi-GB
      # MHA JIT libs build once (cold miss) and every job reuses them. The
      # `-patches-` segment makes the key change whenever a scripts/*.patch
      # changes (AITER version is already encoded via the submodule SHA).
      - name: Compute shared JIT cache key
        id: cache_key
        run: |
          echo "key=aiter-so-${{ runner.os }}-aiter-${{ steps.aiter_sha.outputs.sha }}-jit-${{ hashFiles('jax_aiter/jit/**') }}-cfg-${{ hashFiles('**/optCompilerConfig.json') }}-patches-${{ hashFiles('scripts/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Create aiter_build directory
        run: mkdir -p build/aiter_build

      - name: Restore AITER JIT modules cache
        id: aiter_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/aiter_build/*.so
          key: ${{ steps.cache_key.outputs.key }}

      - name: Pull container image
        run: docker pull "$IMAGE"

      - name: Launch build container
        run: |
          set -euxo pipefail
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d --name "$CONTAINER_NAME" \
            --network=host \
            --device=/dev/kfd \
            --device=/dev/dri \
            --ipc=host \
            --shm-size=16G \
            --group-add=video \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -e JA_ROOT_DIR="${{ env.JA_ROOT_DIR }}" \
            -e AITER_SYMBOL_VISIBLE="${{ env.AITER_SYMBOL_VISIBLE }}" \
            -e GPU_ARCHS="${{ env.GPU_ARCHS }}" \
            -e AITER_ASM_DIR="${{ env.AITER_ASM_DIR }}" \
            -e HIP_VISIBLE_DEVICES=0 \
            -v "${{ github.workspace }}:/jax-aiter" \
            -w "/jax-aiter" \
            "$IMAGE" tail -f /dev/null

      - name: Install tooling and JAX runtime
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/setup_jax.sh'

      - name: Build (umbrella + JIT[on miss] + FFI + install)
        run: |
          docker exec \
            -e JA_DO_JIT_BUILD="${{ steps.aiter_cache.outputs.cache-hit != 'true' }}" \
            "$CONTAINER_NAME" bash -lc 'bash ci/build.sh'

      - name: Save AITER JIT modules cache
        if: steps.aiter_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/aiter_build/*.so
          key: ${{ steps.cache_key.outputs.key }}

      - name: Test (smoke + unit subset, 1 GPU)
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/test.sh'

      - name: Build summary
        if: always()
        run: |
          docker exec "$CONTAINER_NAME" bash -lc '
            echo "=== Build Artifacts ==="
            echo "Umbrella:"; ls -lh build/jax_aiter_build/libjax_aiter.so 2>/dev/null || echo "Not found"
            echo "AITER JIT:"; ls -lh build/aiter_build/*.so 2>/dev/null || echo "None"
            echo "FFI modules:"; ls -lh build/jax_aiter_build/*.so 2>/dev/null || echo "None"
          ' || true

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
