name: JAX-AITER Cache Refresh

# Force-rebuilds the multi-GB MHA JIT libs weekly and reseeds the shared cache
# under the content key, so the cache never 7-day-evicts (a restore resets the
# eviction timer; this weekly forced rebuild guarantees a fresh entry exists).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write   # needed to delete the existing cache entry before resaving

env:
  IMAGE: ghcr.io/rocm/jax-base-ubu24.rocm720:latest
  JA_ROOT_DIR: /jax-aiter
  AITER_SYMBOL_VISIBLE: 1
  GPU_ARCHS: "gfx942;gfx950"
  AITER_ASM_DIR: /jax-aiter/third_party/aiter/hsa/

jobs:
  refresh-cache:
    runs-on: [self-hosted, Linux]

    env:
      CONTAINER_NAME: rv_aiter_cache_refresh

    steps:
      - name: Fix permissions from previous Docker run
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true
          fi

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get third_party/aiter submodule SHA
        id: aiter_sha
        run: echo "sha=$(git -C third_party/aiter rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Identical to ci.yml / nightly-ci.yml / nightly-perf.yml.
      - name: Compute shared JIT cache key
        id: cache_key
        run: |
          echo "key=aiter-so-${{ runner.os }}-aiter-${{ steps.aiter_sha.outputs.sha }}-jit-${{ hashFiles('jax_aiter/jit/**') }}-cfg-${{ hashFiles('**/optCompilerConfig.json') }}-patches-${{ hashFiles('scripts/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Delete existing cache entry (so the rebuild reseeds it fresh)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.cache_key.outputs.key }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Prefer gh; fall back to the REST API (robust on runners without gh).
          if command -v gh >/dev/null 2>&1; then
            gh cache delete "$KEY" --repo "$REPO" && echo "deleted via gh" || echo "gh: no matching cache (ok)"
          fi
          curl -sS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/caches?key=$KEY" \
            && echo "REST delete issued" || echo "REST delete: nothing to remove (ok)"

      - name: Create aiter_build directory
        run: mkdir -p build/aiter_build

      - name: Pull container image
        run: docker pull "$IMAGE"

      - name: Launch build container
        run: |
          set -euxo pipefail
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d --name "$CONTAINER_NAME" \
            --network=host \
            --device=/dev/kfd \
            --device=/dev/dri \
            --ipc=host \
            --shm-size=16G \
            --group-add=video \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -e JA_ROOT_DIR="${{ env.JA_ROOT_DIR }}" \
            -e AITER_SYMBOL_VISIBLE="${{ env.AITER_SYMBOL_VISIBLE }}" \
            -e GPU_ARCHS="${{ env.GPU_ARCHS }}" \
            -e AITER_ASM_DIR="${{ env.AITER_ASM_DIR }}" \
            -e HIP_VISIBLE_DEVICES=0 \
            -v "${{ github.workspace }}:/jax-aiter" \
            -w "/jax-aiter" \
            "$IMAGE" tail -f /dev/null

      - name: Install tooling and JAX runtime
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/setup_jax.sh'

      - name: Force rebuild JIT libs (umbrella + JIT + FFI + install)
        run: |
          docker exec \
            -e JA_DO_JIT_BUILD=true \
            "$CONTAINER_NAME" bash -lc 'bash ci/build.sh'

      - name: Save refreshed AITER JIT modules cache
        uses: actions/cache/save@v4
        with:
          path: |
            build/aiter_build/*.so
          key: ${{ steps.cache_key.outputs.key }}

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
