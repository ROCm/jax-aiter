name: JAX-AITER Nightly CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rocm/jax-base-ubu24.rocm720:latest
  JA_ROOT_DIR: /jax-aiter
  AITER_SYMBOL_VISIBLE: 1
  GPU_ARCHS: "gfx942;gfx950"
  AITER_ASM_DIR: /jax-aiter/third_party/aiter/hsa/
  # Prebuilt JIT-lib release the fetch step pulls the .so's from.
  JIT_LIBS_RELEASE_TAG: v0.1.0-alpha

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux]

    env:
      CONTAINER_NAME: rv_aiter_nightly

    steps:
      - name: Fix permissions from previous Docker run
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true
          fi

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create aiter_build directory
        run: mkdir -p build/aiter_build

      # Download + verify the prebuilt MHA JIT libs from the release (same
      # verify-or-rebuild gate as ci.yml). PR/nightly normally download; the
      # source build is the fallback only.
      - name: Fetch prebuilt JIT libs (verify-or-rebuild)
        id: fetch_jit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TAG: ${{ env.JIT_LIBS_RELEASE_TAG }}
          GH_REPO: ${{ github.repository }}
          GPU_ARCHS: ${{ env.GPU_ARCHS }}
        run: bash ci/fetch_jit_libs.sh

      - name: Pull container image
        run: docker pull "$IMAGE"

      - name: Launch build container
        run: |
          set -euxo pipefail
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d --name "$CONTAINER_NAME" \
            --network=host \
            --device=/dev/kfd \
            --device=/dev/dri \
            --ipc=host \
            --shm-size=16G \
            --group-add=video \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -e JA_ROOT_DIR="${{ env.JA_ROOT_DIR }}" \
            -e AITER_SYMBOL_VISIBLE="${{ env.AITER_SYMBOL_VISIBLE }}" \
            -e GPU_ARCHS="${{ env.GPU_ARCHS }}" \
            -e AITER_ASM_DIR="${{ env.AITER_ASM_DIR }}" \
            -e HIP_VISIBLE_DEVICES=0 \
            -v "${{ github.workspace }}:/jax-aiter" \
            -w "/jax-aiter" \
            "$IMAGE" tail -f /dev/null

      - name: Install tooling and JAX runtime
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/setup_jax.sh'

      - name: Display environment
        run: |
          docker exec "$CONTAINER_NAME" bash -lc '
            echo "=== System ==="
            echo "Processors: $(nproc)"
            rocm-smi || echo "rocm-smi not available"
            rocminfo | grep -E "Marketing Name:|gfx" || true
          '

      - name: Build (umbrella + JIT[fallback] + FFI + install)
        run: |
          docker exec \
            -e JA_DO_JIT_BUILD="${{ steps.fetch_jit.outputs.rebuild }}" \
            "$CONTAINER_NAME" bash -lc 'bash ci/build.sh'

      - name: Test (smoke + unit subset, 1 GPU)
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/test.sh'

      - name: Build summary
        if: always()
        run: |
          docker exec "$CONTAINER_NAME" bash -lc '
            echo "=== Build Artifacts ==="
            echo "Umbrella:"; ls -lh build/jax_aiter_build/libjax_aiter.so 2>/dev/null || echo "Not found"
            echo "AITER JIT:"; ls -lh build/aiter_build/*.so 2>/dev/null || echo "None"
            echo "FFI modules:"; ls -lh build/jax_aiter_build/*.so 2>/dev/null || echo "None"
          ' || true

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
