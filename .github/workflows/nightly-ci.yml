name: JAX-AITER Nightly CI

# The full suite on 4 GPUs, including the cases the PR tier skips.
#
# Two things this catches that ci.yml cannot:
#   * the `slow` sweeps -- the full BATCH_CORE shape grid and the 70B GEMM shapes
#   * the `multigpu` FSDP sharding cases, which need >= 4 visible devices and so
#     have always skipped silently on the single-GPU path
#
# Like the PR job, JIT libraries are fetched and never built here.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rocm/jax-dev-ubu24.therock-7.14:7.14
  CONTAINER_NAME: ja_ci_nightly
  JA_ROOT_DIR: /jax-aiter
  AITER_SYMBOL_VISIBLE: 1
  GPU_ARCHS: gfx950
  AITER_ASM_DIR: /jax-aiter/third_party/aiter/hsa/
  JIT_LIBS_RELEASE_TAG: jit-libs

jobs:
  full-suite:
    name: full suite (4x MI355)
    runs-on: linux-jax-aiter-mi355-4
    timeout-minutes: 90
    steps:
      - name: Fix permissions from a previous container run
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}" || true
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch prebuilt JIT libs
        id: fetch_jit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_TAG: ${{ env.JIT_LIBS_RELEASE_TAG }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/aiter_build
          bash ci/fetch_jit_libs.sh

      - name: Fail if the JIT libs are missing
        if: steps.fetch_jit.outputs.rebuild == 'true'
        run: |
          echo "::error::No JIT libs matched this AITER pin / arch / patch set." >&2
          echo "Run the 'JIT libs (build + publish)' workflow, then re-run this job." >&2
          exit 1

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Launch container (all visible GPUs)
        run: |
          docker run -d --name "$CONTAINER_NAME" \
            --network=host --device=/dev/kfd --device=/dev/dri \
            --ipc=host --shm-size=32G --group-add=video \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -e JA_ROOT_DIR -e AITER_SYMBOL_VISIBLE -e GPU_ARCHS -e AITER_ASM_DIR \
            -v "${{ github.workspace }}:/jax-aiter" \
            -w /jax-aiter "$IMAGE" tail -f /dev/null

      - name: Environment
        run: |
          docker exec "$CONTAINER_NAME" bash -lc '
            echo "processors: $(nproc)"
            rocm-smi || true
            python3 -c "import jax; print(\"jax devices:\", jax.devices())"
          '

      - name: Install tooling and JAX
        run: docker exec "$CONTAINER_NAME" bash -lc 'bash ci/setup_jax.sh'

      - name: Build (umbrella + FFI shims + install)
        run: |
          docker exec -e JA_SKIP_JIT_BUILD=true "$CONTAINER_NAME" \
            bash -lc 'bash ci/build.sh'

      - name: Test (full suite, including slow and multigpu)
        run: |
          docker exec -e JA_TEST_TIER=nightly "$CONTAINER_NAME" \
            bash -lc 'bash ci/test.sh'

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
